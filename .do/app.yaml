name: hifive-wholesale-preview
region: nyc
services:
  - name: storefront
    environment_slug: node-js
    github:
      repo: Lobbiui/hifivewholesale
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${hifive-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${hifive-db.CA_CERT}
    health_check:
      http_path: /
ingress:
  rules:
    - component:
        name: storefront
      match:
        path:
          prefix: /
databases:
  - name: hifive-db
    engine: PG
    version: "18"
    production: true
    cluster_name: hifive-wholesale-db
    db_name: defaultdb
    db_user: doadmin
